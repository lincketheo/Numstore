name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04 }
          - { runner: ubuntu-24.04-arm }
          - { runner: macos-15 }
          - { runner: macos-15-intel }
          - { runner: windows-2025,   msvc_arch: x64 }
          - { runner: windows-11-arm, msvc_arch: arm64 }

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Use Ninja on Windows
        if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Report toolchain
        run: |
          echo "runner:  ${{ matrix.runner }} ($RUNNER_OS/$RUNNER_ARCH)"
          echo "machine: $(uname -m)"
          cmake --version | head -1
          make --version | head -1

      - name: Debug build and unit tests
        run: make test-unit

      - name: Simulation test
        run: make test-simtest

      - name: Release package
        run: make release-package
