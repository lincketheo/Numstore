name: Docs

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Pages needs to read the repo and mint an id-token for the deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - uses: actions/configure-pages@v5

      - name: Render docs
        run: make docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
