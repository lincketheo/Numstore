name: Wheels

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  # release.yml calls this to build the artifacts it publishes.
  workflow_call:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-15

    steps:
      # Check out the code
      - uses: actions/checkout@v4

      # Execute build wheels
      - name: Build Wheels 
        uses: pypa/cibuildwheel@v4.3.5

      # Upload the wheels
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  # The source distribution: `pip install pynumstore` falls back to this, and
  # the release attaches it.
  build-sdist:
    name: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check metadata
        run: pipx run twine check dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error
