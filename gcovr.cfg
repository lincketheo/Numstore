# gcovr configuration - picked up automatically when gcovr runs from the
# repo root, and passed explicitly by the Makefile's coverage targets.
#
# Paths here are relative to this file, not to the caller's cwd.
#
# The search path (build/coverage) stays on the command line: it is the one
# thing that differs between a local run and whatever a CI job points at.

root = .

# gcov on a multi-binary run reports the odd negative hit count; one warning
# per file is enough to notice without drowning the log.
gcov-ignore-parse-errors = negative_hits.warn_once_per_file

############ Not library code
# apps/ is the two entry points plus the generated unit_tests.c; samples/ is
# documentation; build/ is generated. None of it belongs in the ratio.
exclude = apps
exclude = samples
exclude = build

############ Generic noise
# Blank lines, lone braces and the like, plus the line a function is declared
# on - gcov attributes a hit to the signature, which says nothing about
# whether the body ran.
exclude-noncode-lines = yes
exclude-function-lines = yes

# Branches gcov emits for a line with no decision in it, and the
# exception-unwind edges a C translation unit can never take.
exclude-unreachable-branches = yes
exclude-throw-branches = yes

############ Excluded lines
# Scaffolding that is not program behaviour: an assertion is a statement about
# an invariant, so its line is not a line the tests are supposed to cover and
# its false branch is not a branch they are supposed to take. Same for the
# crash-on-purpose macros - reaching them at all is the bug.
#
# These are matched with re.match against the raw source line, so each
# alternative is anchored at the start of the line after leading whitespace.
# Only the matched line is excluded, so a macro call wrapped over several
# lines only loses its first line; ASSERT bodies inside DEFINE_DBG_ASSERT are
# each their own ASSERT line, so they are caught individually.
#
#   ASSERT / ASSERT_NN / ASSERT_GTE0        core/ns_csx_assert.h
#   DBG_ASSERT / DBG_ASSERT_IF_NN           core/ns_csx_assert.h
#   DEFINE_DBG_ASSERT                       core/ns_csx_assert.h
#   UNREACHABLE / UNIMPLEMENTED / crash     core/ns_csx_assert.h
#   panic                                   core/ns_csx_assert.h
#   _Static_assert                          compile time, never executed
exclude-lines-by-pattern = \s*(ASSERT\w*|DBG_ASSERT\w*|DEFINE_DBG_ASSERT|UNREACHABLE|UNIMPLEMENTED|crash|panic|_Static_assert)\s*\(.*

############ Excluded branches
# Lines that are real code but whose branches belong to the harness rather
# than to the thing under test. The line still counts; only its decisions are
# dropped.
#
#   TEST / TEST_CASE / TEST_DISABLED        core/ns_testing.h - TEST_CASE
#     expands to a for-loop with a pass/fail ternary, so every case carries
#     two branches that describe the harness, not the code
#   test_* / fail_test                      core/ns_testing.h assertions - the
#     failing side is only taken by a broken build
#   test_assert_mark_* / TEST_MARK          core/ns_testing.h
#   FAULT / FAULT_NULL                      core/ns_testing.h - one-sided
#     unless that exact fault name is armed
#   i_log (lvl, ...)                        core/ns_logging.h - the
#     programmatic form fans out over every level at each call site. Spelled
#     with a trailing paren so the i_log_info/i_log_error wrappers, which are
#     plain calls, are left alone
#   i_log_printf (lvl, ...)                 core/ns_logging.h - same fan-out
#     as i_log, one if/else per level plus an UNREACHABLE default. Reaching
#     all six from one call site would mean calling it once per log level,
#     which tests nothing about the caller
#
#   switch (...)                            a switch's gcov branches are one
#     per case target plus the default/fall-through edge, so they say exactly
#     which arms ran - which the line coverage of each arm's body already
#     says. What they add on top is the edge an exhaustive switch over an enum
#     can never take: 93 of those come from switches with no default at all,
#     where the compiler still emits the "matched nothing" path. The arms
#     themselves are still measured, as lines.
#
# WRAP and WRAP_GOTO are deliberately absent: an untaken WRAP is an untested
# error path, which is exactly what this report should be showing.
exclude-branches-by-pattern = \s*(TEST|TEST_CASE|TEST_DISABLED|TEST_NOOP|TEST_BODY_\w+|TEST_WRAPPER|TEST_MARK|test_\w+|fail_test|FAULT|FAULT_NULL|i_log|i_log_printf|switch)\s*\(.*

############ What cannot be excluded here
# Function coverage has no by-pattern exclusion in gcovr (7.2 offers only
# --merge-mode-functions and --include-internal-functions), so the
# DEFINE_DBG_ASSERT-generated *_assert__ functions and the TEST wrappers stay
# in the function denominator. They are all called, so they inflate both
# halves of the ratio rather than skewing it.
